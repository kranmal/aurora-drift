<meta property="og:type" content="website">
<meta property="og:url" content="https://kranmal.github.io/aurora-drift/">
<meta property="og:title" content="Aurora Drift">
<meta property="og:description" content="A synthwave-neon arcade shooter, built to run entirely in the browser.">
<meta property="og:image" content="https://kranmal.github.io/og-image.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#050208;
    --void-2:#0a0414;
    --magenta:#ff2fb0;
    --violet:#8b2fff;
    --cyan:#29f1ff;
    --yellow:#ffe14d;
    --ink:#f5f0ff;
    --dim:#8a80a8;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:var(--void);
    overflow:hidden;
    font-family:'VT323', ui-monospace, 'Courier New', monospace;
  }
  #stage{
    position:relative;
    width:100vw;
    height:100vh;
    background:radial-gradient(ellipse at 50% 40%, var(--void-2) 0%, var(--void) 70%);
    overflow:hidden;
  }
  #stage canvas{
    position:absolute;
    top:0; left:0;
    width:100%;
    height:100%;
    display:block;
  }
  #stars{ z-index:1; }
  #copper{ z-index:2; mix-blend-mode:screen; }
  #ball{ z-index:3; }
  #scroller{ z-index:5; }

  #logo{
    position:absolute;
    top:9%;
    left:0;
    width:100%;
    z-index:4;
    text-align:center;
    pointer-events:none;
  }
  #logo h1{
    margin:0;
    font-family:'Press Start 2P', monospace;
    font-size:clamp(22px, 5vw, 52px);
    letter-spacing:0.08em;
    line-height:1.4;
    color:var(--magenta);
    text-shadow:
      0 0 6px currentColor,
      0 0 18px currentColor,
      0 0 40px rgba(139,47,255,0.6);
    transition:color 0.05s linear;
  }
  #logo .sub{
    margin-top:6px;
    font-family:'VT323', monospace;
    font-size:clamp(14px, 2vw, 20px);
    letter-spacing:0.35em;
    color:var(--dim);
    text-transform:uppercase;
  }

  #hud{
    position:absolute;
    inset:0;
    z-index:6;
    pointer-events:none;
    font-family:'VT323', monospace;
    color:var(--dim);
    text-transform:uppercase;
    letter-spacing:0.12em;
  }
  #hud .tag{
    position:absolute;
    font-size:clamp(12px, 1.4vw, 16px);
    opacity:0.85;
  }
  #hud .tl{ top:18px; left:22px; }
  #hud .tr{ top:18px; right:22px; text-align:right; }
  #hud .tr .accent{ color:var(--cyan); }
  #hud .bl{ bottom:calc(14% + 14px); left:22px; display:flex; align-items:center; gap:8px; }
  #hud .dot{
    width:9px; height:9px; border-radius:50%;
    background:var(--magenta);
    box-shadow:0 0 8px var(--magenta);
    animation:blink-dot 1s steps(1) infinite;
  }

  #scanlines{
    position:absolute;
    inset:0;
    z-index:8;
    pointer-events:none;
    background:repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0) 0px,
      rgba(0,0,0,0) 2px,
      rgba(0,0,0,0.18) 3px,
      rgba(0,0,0,0.18) 4px
    );
    mix-blend-mode:multiply;
    opacity:0.5;
  }
  #vignette{
    position:absolute;
    inset:0;
    z-index:9;
    pointer-events:none;
    background:radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.75) 100%);
  }

  #gate{
    position:absolute;
    inset:0;
    z-index:20;
    background:var(--void);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:26px;
    text-align:center;
    padding:24px;
  }
  #gate.hidden{
    opacity:0;
    visibility:hidden;
    transition:opacity 0.9s ease, visibility 0.9s;
  }
  #gate .glogo{
    font-family:'Press Start 2P', monospace;
    font-size:clamp(20px, 6vw, 44px);
    letter-spacing:0.08em;
    color:var(--cyan);
    text-shadow:0 0 8px var(--cyan), 0 0 30px rgba(41,241,255,0.55);
  }
  #gate .gsub{
    font-family:'VT323', monospace;
    font-size:clamp(14px, 2.2vw, 20px);
    color:var(--dim);
    letter-spacing:0.3em;
    text-transform:uppercase;
  }
  #startBtn{
    font-family:'VT323', monospace;
    font-size:clamp(20px, 3vw, 28px);
    letter-spacing:0.25em;
    text-transform:uppercase;
    color:var(--yellow);
    background:transparent;
    border:2px solid var(--yellow);
    padding:14px 34px;
    cursor:pointer;
    box-shadow:0 0 14px rgba(255,225,77,0.35);
  }
  #startBtn:hover{
    background:rgba(255,225,77,0.1);
  }
  #startBtn:focus-visible{
    outline:3px solid var(--ink);
    outline-offset:4px;
  }
  #startBtn.blink{
    animation:blink-text 1.1s steps(1) infinite;
  }
  #gate .hint{
    font-family:'VT323', monospace;
    font-size:14px;
    color:var(--dim);
    opacity:0.7;
    max-width:40ch;
  }

  @keyframes blink-text{
    0%, 60%{ opacity:1; }
    61%, 100%{ opacity:0.25; }
  }
  @keyframes blink-dot{
    0%, 50%{ opacity:1; }
    51%, 100%{ opacity:0.15; }
  }
  @media (prefers-reduced-motion: reduce){
    #startBtn.blink{ animation:none; }
    .dot{ animation:none; }
  }
</style>

<div id="stage">
  <canvas id="stars" aria-hidden="true"></canvas>
  <canvas id="copper" aria-hidden="true"></canvas>
  <canvas id="ball" aria-hidden="true"></canvas>

  <div id="logo">
    <h1 id="logoText">AURORA DRIFT</h1>
    <div class="sub">a one-file demo intro</div>
  </div>

  <canvas id="scroller" aria-hidden="true"></canvas>

  <div id="hud">
    <div class="tag tl">AURORA DRIFT SYS &middot; V1.0</div>
    <div class="tag tr">TRACK: <span class="accent">HALFTIME DRIFT</span><br>74 BPM &middot; F MAJ / D MIN</div>
    <div class="tag bl"><span class="dot"></span> LIVE RENDER</div>
  </div>

  <div id="scanlines"></div>
  <div id="vignette"></div>

  <div id="gate">
    <div class="glogo">AURORA DRIFT</div>
    <div class="gsub">code &amp; graphics &middot; claude</div>
    <button id="startBtn" class="blink" type="button">Press Fire to Start</button>
    <div class="hint">Plays the soundtrack and starts the intro. Turn your speakers up.</div>
  </div>

  <audio id="track" preload="auto" loop>
    <source src="aurora-drift.mp3" type="audio/mpeg">
  </audio>
</div>

<script>
(function(){
  "use strict";

  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var MO = reduceMotion ? 0.2 : 1;

  var stage = document.getElementById('stage');
  var gate = document.getElementById('gate');
  var startBtn = document.getElementById('startBtn');
  var track = document.getElementById('track');
  var logoText = document.getElementById('logoText');

  var starsCv = document.getElementById('stars');
  var copperCv = document.getElementById('copper');
  var ballCv = document.getElementById('ball');
  var scrollCv = document.getElementById('scroller');

  var starsCtx = starsCv.getContext('2d');
  var copperCtx = copperCv.getContext('2d');
  var ballCtx = ballCv.getContext('2d');
  var scrollCtx = scrollCv.getContext('2d');

  var W = 0, H = 0, DPR = Math.min(window.devicePixelRatio || 1, 2);

  function resize(){
    W = stage.clientWidth;
    H = stage.clientHeight;
    [starsCv, copperCv, ballCv, scrollCv].forEach(function(cv){
      cv.width = Math.floor(W * DPR);
      cv.height = Math.floor(H * DPR);
    });
    starsCtx.setTransform(DPR,0,0,DPR,0,0);
    copperCtx.setTransform(DPR,0,0,DPR,0,0);
    ballCtx.setTransform(DPR,0,0,DPR,0,0);
    scrollCtx.setTransform(DPR,0,0,DPR,0,0);
    initStars();
  }

  // ---- palette cycling, shared by copper bars / logo / scrolltext ----
  var PALETTE = [[255,47,176],[139,47,255],[41,241,255],[255,225,77]];
  function paletteColor(t){
    var n = PALETTE.length;
    t = ((t % n) + n) % n;
    var i0 = Math.floor(t) % n;
    var i1 = (i0 + 1) % n;
    var f = t - Math.floor(t);
    var c0 = PALETTE[i0], c1 = PALETTE[i1];
    var r = Math.round(c0[0] + (c1[0]-c0[0]) * f);
    var g = Math.round(c0[1] + (c1[1]-c0[1]) * f);
    var b = Math.round(c0[2] + (c1[2]-c0[2]) * f);
    return 'rgb(' + r + ',' + g + ',' + b + ')';
  }

  // ---- starfield ----
  var stars = [];
  var STAR_COUNT = 260;
  function initStars(){
    stars = [];
    for (var i = 0; i < STAR_COUNT; i++){
      stars.push({
        x: (Math.random()*2-1) * W,
        y: (Math.random()*2-1) * H,
        z: Math.random() * W
      });
    }
  }
  function drawStars(dt){
    starsCtx.clearRect(0,0,W,H);
    var cx = W/2, cy = H/2;
    var speed = 90 * MO;
    for (var i = 0; i < stars.length; i++){
      var s = stars[i];
      s.z -= speed * dt;
      if (s.z <= 1){
        s.x = (Math.random()*2-1) * W;
        s.y = (Math.random()*2-1) * H;
        s.z = W;
      }
      var k = 128 / s.z;
      var sx = cx + s.x * k;
      var sy = cy + s.y * k;
      if (sx < 0 || sx > W || sy < 0 || sy > H) continue;
      var size = Math.max(0.4, (1 - s.z / W) * 2.6);
      var alpha = Math.min(1, (1 - s.z / W) * 1.3);
      starsCtx.fillStyle = 'rgba(245,240,255,' + alpha.toFixed(2) + ')';
      starsCtx.fillRect(sx, sy, size, size);
    }
  }

  // ---- copper bar ribbon ----
  function drawCopper(t){
    copperCtx.clearRect(0,0,W,H);
    var bandCenter = H * 0.30;
    var lines = 34;
    var spacing = 2.6;
    var lineH = 2.4;
    var amp = 16 * MO;
    var bandHeight = lines * spacing;
    var startY = bandCenter - bandHeight/2;
    for (var i = 0; i < lines; i++){
      var wave = Math.sin(t * 1.3 + i * 0.22) * amp;
      var y = startY + i * spacing + wave;
      copperCtx.fillStyle = paletteColor(t * 0.35 + i * 0.05);
      copperCtx.globalAlpha = 0.55;
      copperCtx.fillRect(0, y, W, lineH);
    }
    copperCtx.globalAlpha = 1;
  }

  // ---- bouncing checkered ball ----
  var floorGridPhase = 0;
  function drawFloorGrid(t){
    var floorY = H * 0.62;
    ballCtx.save();
    ballCtx.strokeStyle = 'rgba(139,47,255,0.35)';
    ballCtx.lineWidth = 1;
    var rows = 7;
    for (var i = 0; i < rows; i++){
      var frac = (i + (floorGridPhase % 1)) / rows;
      var y = floorY + frac * frac * (H - floorY);
      var alpha = 0.35 * (1 - frac);
      ballCtx.strokeStyle = 'rgba(139,47,255,' + Math.max(0, alpha).toFixed(2) + ')';
      ballCtx.beginPath();
      ballCtx.moveTo(0, y);
      ballCtx.lineTo(W, y);
      ballCtx.stroke();
    }
    var vanishX = W/2;
    for (var c = -4; c <= 4; c++){
      ballCtx.strokeStyle = 'rgba(139,47,255,0.18)';
      ballCtx.beginPath();
      ballCtx.moveTo(vanishX + c * 40, floorY);
      ballCtx.lineTo(vanishX + c * 220, H);
      ballCtx.stroke();
    }
    ballCtx.restore();
  }

  function drawBall(t){
    var cx = W/2;
    var floorY = H * 0.62;
    var radius = Math.min(W, H) * 0.075;
    var amplitude = H * 0.20;
    var period = 1.15;
    var tt = (t % period) / period;
    var heightFrac = 4 * tt * (1 - tt);
    var cy = floorY - heightFrac * amplitude * MO - radius;

    var near = Math.max(0, 0.08 - heightFrac) / 0.08;
    var sx = 1 + near * 0.22;
    var sy = 1 - near * 0.28;

    var shadowScale = 0.55 + 0.45 * (1 - heightFrac);
    ballCtx.save();
    ballCtx.translate(cx, floorY + 4);
    ballCtx.scale(shadowScale, shadowScale * 0.32);
    var shGrad = ballCtx.createRadialGradient(0,0,0,0,0,radius*1.3);
    shGrad.addColorStop(0, 'rgba(0,0,0,0.55)');
    shGrad.addColorStop(1, 'rgba(0,0,0,0)');
    ballCtx.fillStyle = shGrad;
    ballCtx.beginPath();
    ballCtx.arc(0,0,radius*1.3,0,Math.PI*2);
    ballCtx.fill();
    ballCtx.restore();

    var angle = t * 2.4 * MO;
    ballCtx.save();
    ballCtx.translate(cx, cy);
    ballCtx.scale(sx, sy);
    ballCtx.beginPath();
    ballCtx.arc(0,0,radius,0,Math.PI*2);
    ballCtx.clip();

    ballCtx.fillStyle = '#f5f0ff';
    ballCtx.fillRect(-radius, -radius, radius*2, radius*2);

    ballCtx.rotate(angle);
    var seg = 8;
    var cell = (radius*2) / seg;
    ballCtx.translate(-radius, -radius);
    for (var i = 0; i < seg; i++){
      for (var j = 0; j < seg; j++){
        if ((i + j) % 2 === 0){
          ballCtx.fillStyle = '#ff2fb0';
          ballCtx.fillRect(i*cell, j*cell, cell, cell);
        }
      }
    }
    ballCtx.restore();

    ballCtx.save();
    ballCtx.translate(cx, cy);
    ballCtx.scale(sx, sy);
    var shade = ballCtx.createRadialGradient(-radius*0.35,-radius*0.35,radius*0.1, 0,0,radius*1.15);
    shade.addColorStop(0, 'rgba(255,255,255,0.35)');
    shade.addColorStop(0.5, 'rgba(255,255,255,0)');
    shade.addColorStop(1, 'rgba(0,0,0,0.45)');
    ballCtx.fillStyle = shade;
    ballCtx.beginPath();
    ballCtx.arc(0,0,radius,0,Math.PI*2);
    ballCtx.fill();
    ballCtx.strokeStyle = 'rgba(5,2,8,0.6)';
    ballCtx.lineWidth = 1.5;
    ballCtx.stroke();
    ballCtx.restore();
  }

  // ---- sine scrolltext ----
  var MESSAGE = "welcome to this totally unnecessary but utterly glorious demo intro   " +
    "*  greetings fly out to every 68000 still humming in a dusty attic  " +
    "*  code and graphics by claude  " +
    "*  music: 'halftime drift' by claude — 74 bpm, halftime drum & bass over a lofi bed  " +
    "*  56 bars, no cracktro required  " +
    "*  this message will loop forever, just like it did in 1991  " +
    "*  press nothing, there is nothing to press  " +
    "*  enjoy the show  * ";
  var scrollX = 0;
  var scrollFont = '32px VT323, monospace';
  var charWidths = null;
  var totalWidth = 0;

  function measureMessage(){
    scrollCtx.font = scrollFont;
    charWidths = [];
    totalWidth = 0;
    for (var i = 0; i < MESSAGE.length; i++){
      var w = scrollCtx.measureText(MESSAGE[i]).width;
      charWidths.push(w);
      totalWidth += w;
    }
  }

  function drawScroller(t, dt){
    var stripH = Math.max(56, H * 0.09);
    var y0 = H - stripH;
    scrollCtx.clearRect(0, y0 - 20, W, stripH + 20);

    scrollCtx.fillStyle = 'rgba(5,2,8,0.92)';
    scrollCtx.fillRect(0, y0, W, stripH);
    scrollCtx.strokeStyle = 'rgba(139,47,255,0.6)';
    scrollCtx.lineWidth = 2;
    scrollCtx.beginPath();
    scrollCtx.moveTo(0, y0);
    scrollCtx.lineTo(W, y0);
    scrollCtx.stroke();

    if (!charWidths) measureMessage();

    scrollX -= 140 * MO * dt;
    if (scrollX < -totalWidth) scrollX += totalWidth;

    scrollCtx.font = scrollFont;
    scrollCtx.textBaseline = 'alphabetic';
    var baseY = y0 + stripH * 0.68;
    var ampY = stripH * 0.18;

    var x = scrollX;
    var idx = 0;
    while (x < W){
      var ch = MESSAGE[idx % MESSAGE.length];
      var w = charWidths[idx % MESSAGE.length];
      if (x + w > 0){
        var wobble = Math.sin(t * 3.2 + x * 0.045) * ampY;
        scrollCtx.fillStyle = paletteColor(t * 0.6 + idx * 0.10);
        scrollCtx.fillText(ch, x, baseY + wobble);
      }
      x += w;
      idx++;
      if (idx > MESSAGE.length * 4) break;
    }
  }

  // ---- main loop ----
  var lastTime = null;
  var startTime = null;
  function frame(now){
    if (startTime === null) startTime = now;
    var t = (now - startTime) / 1000;
    var dt = lastTime === null ? 0 : Math.min(0.05, (now - lastTime) / 1000);
    lastTime = now;

    drawStars(dt);
    drawCopper(t);
    ballCtx.clearRect(0,0,W,H);
    drawFloorGrid(t);
    drawBall(t);
    drawScroller(t, dt);

    logoText.style.color = paletteColor(t * 0.3);
    logoText.style.textShadow =
      '0 0 6px currentColor, 0 0 18px currentColor, 0 0 40px rgba(139,47,255,0.6)';

    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(frame);

  startBtn.addEventListener('click', function(){
    gate.classList.add('hidden');
    track.currentTime = 0;
    var p = track.play();
    if (p && p.catch) p.catch(function(){});
  });
})();
</script>
